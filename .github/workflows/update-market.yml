name: 每日 ETF 共享行情更新
on:
  workflow_dispatch:
  schedule:
    # 北京时间工作日收盘后17:27~23:27，分批更新，避免每次上千条请求。
    # UTC 是北京时间减去8小时。
    - cron: '27 9-15 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: yaoyao-pages-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install AKShare
        run: python -m pip install --upgrade 'akshare>=1.17' pandas requests
      - name: Fetch and merge verified ETF daily bars
        env:
          ETF_BATCH_LIMIT: '160'
        run: python scripts/update_market.py
      - name: Disable Jekyll
        run: touch .nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload snapshot and web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
